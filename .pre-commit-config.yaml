default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages: [pre-commit]

repos:
  # General-purpose file hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace  # strip trailing whitespace
      - id: end-of-file-fixer  # ensure a single trailing newline
      - id: check-yaml  # validate YAML syntax
      - id: check-toml  # validate TOML syntax
      - id: check-added-large-files  # block accidentally committed large files
      - id: check-case-conflict  # catch names that collide on case-insensitive filesystems

  # Lint and format with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check  # lint, autofixing what it safely can
        args: [--fix]
      - id: ruff-format  # format code

  # Static type checking with ty
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.55
    hooks:
      - id: ty

  # Enforce Conventional Commits on the commit message
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: conventional commit
        stages: [commit-msg]
        args: [--verbose, --strict, feat, fix, docs, style, test, chore]
